```html
<!DOCTYPE html>
<html>

<head>

<title>AI Support Bot</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

/* CHATBOT */

.chatbot{

    position:fixed;

    right:20px;

    bottom:20px;

    width:380px;

    height:700px;

    background:white;

    border-radius:20px;

    overflow:hidden;

    box-shadow:0px 4px 20px rgba(0,0,0,0.2);

    display:flex;

    flex-direction:column;
}


/* HEADER */

.header{

    background:#d6b3f7;

    color:#2e3a59;

    padding:20px;

    font-size:32px;

    font-weight:bold;
}


/* CHAT AREA */

#chat{

    flex:1;

    overflow-y:auto;

    padding:15px;

    background:#f7f7f7;
}


/* MESSAGE */

.message{

    margin-bottom:15px;

    display:flex;
}

.user{

    justify-content:flex-end;
}

.bot{

    justify-content:flex-start;
}


.bubble{

    max-width:75%;

    padding:14px;

    border-radius:18px;

    font-size:16px;

    line-height:1.4;

    white-space:pre-wrap;
}


.user .bubble{

    background:#d8b7f7;

    color:#2e3a59;
}


.bot .bubble{

    background:#ececec;

    color:#2e3a59;
}


/* OPTIONS */

.options{

    margin-top:10px;
}


.option-btn{

    padding:10px 15px;

    margin:5px;

    border:none;

    border-radius:12px;

    background:white;

    border:2px solid #d6b3f7;

    cursor:pointer;

    font-size:15px;
}


.option-btn:hover{

    background:#f0e0ff;
}


/* INPUT */

.input-area{

    display:flex;

    padding:15px;

    border-top:1px solid #ddd;

    background:white;
}


#msg{

    flex:1;

    padding:12px;

    border-radius:15px;

    border:1px solid #ccc;

    outline:none;
}


.send-btn{

    margin-left:10px;

    padding:12px 18px;

    border:none;

    border-radius:15px;

    background:#d6b3f7;

    cursor:pointer;
}


.send-btn:hover{

    background:#c89ef0;
}


/* LOADING */

.loading{

    font-style:italic;

    color:#666;

}

</style>

</head>


<body>


<div class="chatbot">


    <!-- HEADER -->

    <div class="header">

        AI Support Bot

    </div>


    <!-- CHAT -->

    <div id="chat">


        <!-- FIRST QUESTION -->

        <div class="message bot">

            <div class="bubble">

                Please select issue category


                <div class="options">


                    <button
                        class="option-btn"
                        onclick="cameraIssue()"
                    >

                        Camera Issue

                    </button>


                    <button
                        class="option-btn"
                        onclick="softwareIssue()"
                    >

                        Software Issue

                    </button>


                </div>

            </div>

        </div>


    </div>


    <!-- INPUT -->

    <div class="input-area">


        <input
            type="text"
            id="msg"
            placeholder="Reply here..."
        >


        <button
            class="send-btn"
            onclick="sendMessage()"
        >

            Send

        </button>


    </div>


</div>



<script>


/* =====================================================
   GLOBAL VARIABLES
===================================================== */


window.awaitingUsername = false;

window.selectedIssue = "";


const chat = document.getElementById("chat");



/* =====================================================
   ADD USER MESSAGE
===================================================== */


function addUser(text){

    chat.innerHTML += `

        <div class="message user">

            <div class="bubble">

                ${text}

            </div>

        </div>

    `;


    scrollBottom();

}



/* =====================================================
   ADD BOT MESSAGE
===================================================== */


function addBot(text){

    chat.innerHTML += `

        <div class="message bot">

            <div class="bubble">

                ${text}

            </div>

        </div>

    `;


    scrollBottom();

}



/* =====================================================
   CAMERA ISSUE
===================================================== */


function cameraIssue(){

    addUser("Camera Issue");


    chat.innerHTML += `

        <div class="message bot">

            <div class="bubble">

                Please select camera issue


                <div class="options">


                    <button
                        class="option-btn"
                        onclick="sendOption('rollover')"
                    >

                        Rollover event issue

                    </button>


                    <button
                        class="option-btn"
                        onclick="sendOption('motion detection false alert')"
                    >

                        Motion Alert

                    </button>


                </div>

            </div>

        </div>

    `;


    scrollBottom();

}



/* =====================================================
   SOFTWARE ISSUE
===================================================== */


function softwareIssue(){

    addUser("Software Issue");


    chat.innerHTML += `

        <div class="message bot">

            <div class="bubble">

                Please select software issue


                <div class="options">


                    <button
                        class="option-btn"
                        onclick="sendOption('App crashing')"
                    >

                        App Crash

                    </button>


                    <button
                        class="option-btn"
                        onclick="sendOption('Login issue')"
                    >

                        Login Issue

                    </button>


                </div>

            </div>

        </div>

    `;


    scrollBottom();

}



/* =====================================================
   OPTION CLICK
===================================================== */


async function sendOption(text){

    addUser(text);


    window.selectedIssue = text;


    /* ---------------------------------------------
       ROLLOVER
    --------------------------------------------- */


    if(text === "rollover"){

        addBot(`

            <b>Recommended Solution</b><br><br>

            1. Check for camera angle<br>

            2. Camera height<br>

            3. Check internet connection<br>

            4. Restart the camera<br><br>

            Can you please share your username?

        `);


        window.awaitingUsername = true;

        return;

    }


    /* ---------------------------------------------
       MOTION ALERT
    --------------------------------------------- */


    if(text === "motion detection false alert"){

        addBot(`

            <b>Recommended Solution</b><br><br>

            1. Reduce motion sensitivity<br>

            2. Avoid fan/light movement<br>

            3. Update firmware<br>

            4. Check notification settings

        `);

        return;

    }


    /* ---------------------------------------------
       APP CRASH
    --------------------------------------------- */


    if(text === "App crashing"){

        addBot(`

            <b>Recommended Solution</b><br><br>

            1. Update the app<br>

            2. Clear cache<br>

            3. Restart mobile<br>

            4. Reinstall app

        `);

        return;

    }


    /* ---------------------------------------------
       LOGIN
    --------------------------------------------- */


    if(text === "Login issue"){

        addBot(`

            <b>Recommended Solution</b><br><br>

            1. Reset password<br>

            2. Verify internet connection<br>

            3. Verify email/mobile number

        `);

        return;

    }

}



/* =====================================================
   SEND MESSAGE
===================================================== */


async function sendMessage(){

    const input = document.getElementById("msg");

    const text = input.value.trim();


    if(text === ""){

        return;

    }


    /* Show user message */

    addUser(text);


    /* Clear input */

    input.value = "";


    /* =================================================
       USERNAME SEARCH
    ================================================= */


    if(window.awaitingUsername){

        try{


            const usernameResponse = await fetch(
                "/search-user",
                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                        "application/json"

                    },

                    body:JSON.stringify({

                        username:text,

                        issue:
                        window.selectedIssue

                    })

                }
            );


            /* -----------------------------------------
               CHECK RESPONSE
            ----------------------------------------- */


            if(!usernameResponse.ok){

                throw new Error(
                    "Server returned an error"
                );

            }


            /* -----------------------------------------
               CREATE EMPTY BOT MESSAGE
            ----------------------------------------- */


            const messageDiv =
                document.createElement("div");


            messageDiv.className =
                "message bot";


            const bubble =
                document.createElement("div");


            bubble.className =
                "bubble";


            messageDiv.appendChild(bubble);


            chat.appendChild(messageDiv);


            scrollBottom();


            /* -----------------------------------------
               STREAM RESPONSE
            ----------------------------------------- */


            const reader =
                usernameResponse.body.getReader();


            const decoder =
                new TextDecoder();


            let botText = "";


            while(true){

                const {
                    value,
                    done
                } = await reader.read();


                if(done){

                    break;

                }


                const chunk =
                    decoder.decode(
                        value,
                        {
                            stream:true
                        }
                    );


                botText += chunk;


                /* -------------------------------------
                   Display immediately
                ------------------------------------- */


                bubble.innerHTML =
                    botText.replace(
                        /\n/g,
                        "<br>"
                    );


                scrollBottom();

            }


            /* -----------------------------------------
               STREAM FINISHED
            ----------------------------------------- */


            window.awaitingUsername = false;


        }
        catch(error){

            console.error(error);


            addBot(
                "Sorry, there was a server error."
            );

        }


        return;

    }


    /* =================================================
       NORMAL CHAT
    ================================================= */


    await normalChat(text);

}



/* =====================================================
   NORMAL CHAT
===================================================== */


async function normalChat(message){

    try{


        const chatResponse = await fetch(
            "/chat",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json"

                },

                body:JSON.stringify({

                    message:message

                })

            }
        );


        if(!chatResponse.ok){

            throw new Error(
                "Server error"
            );

        }


        const data =
            await chatResponse.json();


        addBot(data.reply);


    }
    catch(error){

        console.error(error);


        addBot(
            "Sorry, there was a server error."
        );

    }

}



/* =====================================================
   ENTER KEY
===================================================== */


document
.getElementById("msg")
.addEventListener(
    "keypress",
    function(event){

        if(event.key === "Enter"){

            sendMessage();

        }

    }
);



/* =====================================================
   AUTO SCROLL
===================================================== */


function scrollBottom(){

    chat.scrollTop =
        chat.scrollHeight;

}

</script>


</body>

</html>
```
