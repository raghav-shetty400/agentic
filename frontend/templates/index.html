<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Bot</title>



<style>

.loading-status {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 15px;
    font-size: 13px;
    color: #555;
}

.spinner {
    width: 16px;
    height: 16px;
    border: 3px solid #ddd;
    border-top: 3px solid #007bff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

#responseTimer {
    font-weight: bold;
    color: #333;
}

.stop-btn {
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 6px 12px;
    cursor: pointer;
}

.stop-btn:hover {
    background: #b02a37;
}

.send-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}



body {

    margin: 0;

    font-family: Arial;

    background: #f5f5f5;

}





/* =====================================================

   CHATBOT

===================================================== */



.chatbot {



    position: fixed;



    right: 20px;



    bottom: 20px;



    width: 380px;



    height: 700px;



    background: white;



    border-radius: 20px;



    overflow: hidden;



    box-shadow: 0px 4px 20px rgba(0,0,0,0.2);



    display: flex;



    flex-direction: column;

}





/* =====================================================

   HEADER

===================================================== */



.header {



    background: #d6b3f7;



    color: #2e3a59;



    padding: 20px;



    font-size: 32px;



    font-weight: bold;

}





/* =====================================================

   CHAT AREA

===================================================== */



#chat {



    flex: 1;



    overflow-y: auto;



    padding: 15px;



    background: #f7f7f7;

}





/* =====================================================

   MESSAGE

===================================================== */



.message {



    margin-bottom: 15px;



    display: flex;

}



.user {



    justify-content: flex-end;

}



.bot {



    justify-content: flex-start;

}





.bubble {



    max-width: 75%;



    padding: 14px;



    border-radius: 18px;



    font-size: 16px;



    line-height: 1.4;



    white-space: pre-wrap;

}





.user .bubble {



    background: #d8b7f7;



    color: #2e3a59;

}





.bot .bubble {



    background: #ececec;



    color: #2e3a59;

}





/* =====================================================

   OPTIONS

===================================================== */



.options {



    margin-top: 10px;

}





.option-btn {



    padding: 10px 15px;



    margin: 5px;



    border: none;



    border-radius: 12px;



    background: white;



    border: 2px solid #d6b3f7;



    cursor: pointer;



    font-size: 15px;

}





.option-btn:hover {



    background: #f0e0ff;

}





/* =====================================================

   INPUT

===================================================== */



.input-area {



    display: flex;



    padding: 15px;



    border-top: 1px solid #ddd;



    background: white;

}





#msg {



    flex: 1;



    padding: 12px;



    border-radius: 15px;



    border: 1px solid #ccc;



    outline: none;

}





.send-btn {



    margin-left: 10px;



    padding: 12px 18px;



    border: none;



    border-radius: 15px;



    background: #d6b3f7;



    cursor: pointer;

}





.send-btn:hover {



    background: #c89ef0;

}





/* =====================================================
   PERSISTENT RESPONSE TIME
   Remains visible after the loading indicator disappears.
   ===================================================== */

.response-time-display {
    display: none;
    padding: 8px 15px;
    background: #f7f0ff;
    color: #5b3685;
    font-size: 13px;
    font-weight: bold;
    border-top: 1px solid #ddd;
}

/* =====================================================

   LOADING

===================================================== */



.loading {



    font-style: italic;



    color: #666;

}





/* Keep the chatbot usable on smaller screens. */
@media (max-width: 480px) {
    .chatbot {
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }

    .header {
        font-size: 25px;
        padding: 16px;
    }
}

</style>



</head>





<body>





<div class="chatbot">





    <!-- =================================================

         HEADER

    ================================================= -->



    <div class="header">



        AI Support Bot



    </div>





    <!-- =================================================

         CHAT

    ================================================= -->



    <div id="chat">
        <div class="message bot">
            <div class="bubble">
                Hello! 👋
                <br><br>
                How can I assist you today?
                <div class="options">
                    <button class="option-btn" type="button" onclick="showMainOption('Product Information')">Product Information</button>
                    <button class="option-btn" type="button" onclick="showMainOption('Device Troubleshooting')">Device Troubleshooting</button>
                    <button class="option-btn" type="button" onclick="showMainOption('HubbleClub App Questions and Troubleshooting')">HubbleClub App Questions and Troubleshooting</button>
                </div>
            </div>
        </div>
    </div>





    <!-- =================================================

         INPUT

    ================================================= -->



<div class="input-area">
    <input
        type="text"
        id="msg"
        placeholder="Ask anything..."
        autocomplete="off"
    >

    <button
        class="send-btn"
        id="sendButton"
        onclick="sendMessage()"
    >
        Send
    </button>
</div>

<!-- =================================================
     LOADING STATUS
     Visible while the chatbot generates a response.
     ================================================= -->

<div id="loadingStatus" class="loading-status" style="display: none;">

    <!-- Animated spinner -->
    <div class="spinner"></div>

    <!-- Loading message -->
    <span id="loadingText">Thinking...</span>

    <!-- Live elapsed time -->
    <span id="responseTimer">0.0 sec</span>

    <!-- Stop button -->
    <button
        class="stop-btn"
        id="stopButton"
        onclick="stopResponse()"
    >
        Stop
    </button>

</div> <!-- IMPORTANT: Close loadingStatus here -->


<!-- =================================================
     PERMANENT RESPONSE TIME
     This must be outside loadingStatus.
     ================================================= -->

<div
    id="responseTimeDisplay"
    class="response-time-display"
    style="display: none;"
>
    <span id="finalResponseTime">
        Response time: 0.00 sec
    </span>
</div>







<script>





/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

// Existing support-flow state used by the chatbot.
window.awaitingUsername = false;
window.selectedIssue = "";

// WebSocket and streaming-response state.
let socket = null;
let currentBubble = null;
let currentResponse = "";
let websocketConnected = false;
const chat = document.getElementById("chat");

// Loading indicator and elapsed-time state.
let responseStartTime = null;
let responseInProgress = false;
let stopRequested = false;
let responseTimerInterval = null;


/* =====================================================
   START RESPONSE UI
   Show the spinner, start the timer and disable Send.
   ===================================================== */
function startResponseUI() {
    responseInProgress = true;
    stopRequested = false;
    responseStartTime = Date.now();

    const loadingStatus = document.getElementById("loadingStatus");
    const sendButton = document.getElementById("sendButton");
    const loadingText = document.getElementById("loadingText");
    const timerElement = document.getElementById("responseTimer");

    // Hide the previous request's final time while a new request runs.
    document.getElementById("responseTimeDisplay").style.display = "none";

    // Display the loading area and reset its labels.
    loadingStatus.style.display = "flex";
    
    // Show spinner and Stop button for the new request
    document.querySelector(".spinner").style.display = "block";
    document.getElementById("stopButton").style.display = "inline-block";
    loadingText.textContent = "Thinking...";
    timerElement.textContent = "0.0 sec";

    // Prevent the user from submitting another request mid-stream.
    sendButton.disabled = true;
    sendButton.textContent = "Sending...";

    // Clear any previous timer before starting a fresh interval.
    clearInterval(responseTimerInterval);

    // Refresh the elapsed time every 100 milliseconds.
    responseTimerInterval = setInterval(function () {

        if (responseStartTime === null) {
            return;
        }

        const elapsed = (Date.now() - responseStartTime) / 1000;
        timerElement.textContent = elapsed.toFixed(1) + " sec";

    }, 100);
}


/* =====================================================
   FINISH RESPONSE UI
   Stops the spinner but keeps the final response time
   visible after the chatbot finishes.
   ===================================================== */

function finishResponseUI() {

    // Calculate total elapsed time before clearing the start timestamp.
    let finalTime = 0;

    if (responseStartTime !== null) {
        finalTime = (Date.now() - responseStartTime) / 1000;
    }

    // Stop the live timer.
    clearInterval(responseTimerInterval);
    responseTimerInterval = null;

    // Mark the response as no longer active.
    responseInProgress = false;
    responseStartTime = null;

    // Hide the temporary loading row.
    document.getElementById("loadingStatus").style.display = "none";

    // Show the final response time in its own persistent row.
    document.getElementById("finalResponseTime").textContent =
        "Response time: " + finalTime.toFixed(2) + " sec";

    document.getElementById("responseTimeDisplay").style.display = "block";

    // Restore the Send button for the next question.
    const sendButton = document.getElementById("sendButton");
    sendButton.disabled = false;
    sendButton.textContent = "Send";
}


/* =====================================================
   WEBSOCKET CONNECTION
===================================================== */

function connectWebSocket() {

    console.log(
        "========== CONNECTING WEBSOCKET =========="
    );

    socket =
        new WebSocket(
            "ws://127.0.0.1:8765"
        );

    socket.onopen = function() {

        websocketConnected = true;

        console.log(
            "========== WEBSOCKET CONNECTED =========="
        );

        console.log(
            "WebSocket state:",
            socket.readyState
        );
    };

    /* =====================================================
       RECEIVE STREAMED RESPONSE
       The backend sends text chunks followed by STREAM_END.
       ===================================================== */
    socket.onmessage = function(event) {

        const data = event.data;
        console.log("Received WebSocket data:", JSON.stringify(data));

        // The backend uses this marker to tell the browser the reply is complete.
        if (data === "[[STREAM_END]]") {

            console.log("========== STREAM FINISHED ==========");
            console.log("Final response:", currentResponse);

            // Preserve the existing username-verification flow.
            if (
                currentResponse.toLowerCase().includes("username") ||
                currentResponse.toLowerCase().includes("email address")
            ) {
                window.awaitingUsername = true;
            }

            // Stop timer, hide spinner and enable Send again.
            finishResponseUI();

            // Reset only the streaming variables for the next request.
            currentBubble = null;
            currentResponse = "";
            scrollBottom();
            return;
        }

        // Create one bot bubble when the first response chunk arrives.
        if (currentBubble === null) {
            currentBubble = createStreamingMessage();
        }

        // Append each chunk to the same bubble.
        currentResponse += data;
        currentBubble.textContent = currentResponse;
        scrollBottom();
    };

    socket.onerror = function(error) {

        websocketConnected = false;

        console.error(
            "========== WEBSOCKET ERROR =========="
        );

        console.error(error);

        // Avoid leaving the UI in a permanent loading state after an error.
        if (responseInProgress) {
            finishResponseUI();
        }
    };

    socket.onclose = function(event) {

        websocketConnected = false;

        console.log(
            "========== WEBSOCKET CLOSED =========="
        );

        console.log("Code:", event.code);
        console.log("Reason:", event.reason);

        // Restore the input controls if the connection closes mid-response.
        if (responseInProgress) {
            finishResponseUI();
        }

        // Reconnect after a short delay.
        setTimeout(function() {
            connectWebSocket();
        }, 1000);
    };
}

connectWebSocket();


/* =====================================================

   ADD USER MESSAGE

===================================================== */



function addUser(text) {



    const message =

        document.createElement("div");



    message.className =

        "message user";





    const bubble =

        document.createElement("div");



    bubble.className =

        "bubble";





    bubble.textContent =

        text;





    message.appendChild(

        bubble

    );





    chat.appendChild(

        message

    );





    scrollBottom();

}





/* =====================================================

   ADD BOT MESSAGE

===================================================== */



function addBot(text) {



    const message =

        document.createElement("div");



    message.className =

        "message bot";





    const bubble =

        document.createElement("div");



    bubble.className =

        "bubble";





    bubble.innerHTML =

        text.replace(

            /\n/g,

            "<br>"

        );





    message.appendChild(

        bubble

    );





    chat.appendChild(

        message

    );





    scrollBottom();

}





/* =====================================================

   CREATE STREAMING MESSAGE

===================================================== */



function createStreamingMessage() {



    const message =

        document.createElement("div");



    message.className =

        "message bot";





    const bubble =

        document.createElement("div");



    bubble.className =

        "bubble";





    message.appendChild(

        bubble

    );





    chat.appendChild(

        message

    );





    scrollBottom();





    return bubble;

}





/* =====================================================

   CAMERA ISSUE

===================================================== */




/* =====================================================
   NEW SUPPORT MENUS
   These additions keep the existing WebSocket pipeline.
===================================================== */
function addMenuMessage(question, options, clickHandler, includeBack = true) {
    const message = document.createElement("div");
    message.className = "message bot";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = question;

    const optionsDiv = document.createElement("div");
    optionsDiv.className = "options";

    options.forEach(function (option) {
        const button = document.createElement("button");
        button.className = "option-btn";
        button.type = "button";
        button.textContent = option;
        button.addEventListener("click", function () {
            clickHandler(option);
        });
        optionsDiv.appendChild(button);
    });

    if (includeBack) {
        const backButton = document.createElement("button");
        backButton.className = "option-btn";
        backButton.type = "button";
        backButton.textContent = "Back to main menu";
        backButton.addEventListener("click", showMainMenu);
        optionsDiv.appendChild(backButton);
    }

    bubble.appendChild(document.createElement("br"));
    bubble.appendChild(optionsDiv);
    message.appendChild(bubble);
    chat.appendChild(message);
    scrollBottom();
}

function showMainMenu() {
    addMenuMessage("How can I assist you today?", [
        "Product Information",
        "Device Troubleshooting",
        "HubbleClub App Questions and Troubleshooting"
    ], showMainOption, false);
}

function showMainOption(option) {
    addUser(option);

    if (option === "Product Information") {
        addMenuMessage("Which product would you like to know more about?", [
            "AI-Powered Monitors",
            "Smart Video Monitors",
            "Smart Soothers & Audio Monitors",
            "Movement Trackers",
            "Health & Wellness Devices",
            "Roo - Prenatal Device"
        ], function (product) {
            addUser(product);
            window.selectedIssue = product;
            normalChat("Tell me about " + product + ", including its features and setup.");
        });
        return;
    }

    if (option === "Device Troubleshooting") {
        addMenuMessage("Please select your device issue.", [
            "Device not powering on",
            "Device not connecting to Wi-Fi",
            "Camera offline or disconnected",
            "Video/live stream not working",
            "Night vision issue",
            "Rollover event issue",
            "Motion detection false alert",
            "Sound/audio issue",
            "Notifications/alerts not working",
            "Device setup/pairing issue",
            "Firmware update issue",
            "Other device issue"
        ], function (issue) {
            addUser(issue);
            window.selectedIssue = issue;
            // Keep legacy issue wording where the current backend expects it.
            const backendMessage = {
                "Rollover event issue": "rollover",
                "Motion detection false alert": "motion detection false alert",
                "Device not powering on": "Device not powering on",
                "Device not connecting to Wi-Fi": "Device not connecting to Wi-Fi",
                "Camera offline or disconnected": "Camera offline or disconnected",
                "Video/live stream not working": "Video/live stream not working",
                "Night vision issue": "Night vision issue",
                "Sound/audio issue": "Sound/audio issue",
                "Notifications/alerts not working": "Notifications/alerts not working",
                "Device setup/pairing issue": "Device setup/pairing issue",
                "Firmware update issue": "Firmware update issue",
                "Other device issue": "Other device issue"
            }[issue] || issue;
            normalChat(backendMessage);
        });
        return;
    }

    if (option === "HubbleClub App Questions and Troubleshooting") {
        addMenuMessage("What do you need help with in the HubbleClub app?", [
            "Cannot log in",
            "Forgot/reset password",
            "App crashing",
            "App not opening",
            "Cannot add/pair a device",
            "Live video not loading",
            "Notifications not received",
            "Subscription/membership question",
            "Account/profile update",
            "App permissions",
            "App update issue",
            "Other app issue"
        ], function (issue) {
            addUser(issue);
            window.selectedIssue = issue;
            // Map the two legacy software labels to their existing backend wording.
            const backendMessage = {
                "App crashing": "App crashing",
                "Cannot log in": "Login issue"
            }[issue] || issue;
            normalChat(backendMessage);
        });
    }
}

function cameraIssue() {



    addUser(

        "Camera Issue"

    );





    const message =

        document.createElement("div");



    message.className =

        "message bot";





    const bubble =

        document.createElement("div");



    bubble.className =

        "bubble";





    bubble.innerHTML = `



        Please select camera issue



        <div class="options">



            <button

                class="option-btn"

                onclick="sendOption('rollover')"

            >

                Rollover event issue

            </button>



            <button

                class="option-btn"

                onclick="sendOption('motion detection false alert')"

            >

                Motion Alert

            </button>



        </div>



    `;





    message.appendChild(

        bubble

    );





    chat.appendChild(

        message

    );





    scrollBottom();

}





/* =====================================================

   SOFTWARE ISSUE

===================================================== */



function softwareIssue() {



    addUser(

        "Software Issue"

    );





    const message =

        document.createElement("div");



    message.className =

        "message bot";





    const bubble =

        document.createElement("div");



    bubble.className =

        "bubble";





    bubble.innerHTML = `



        Please select software issue



        <div class="options">



            <button

                class="option-btn"

                onclick="sendOption('App crashing')"

            >

                App Crash

            </button>



            <button

                class="option-btn"

                onclick="sendOption('Login issue')"

            >

                Login Issue

            </button>



        </div>



    `;





    message.appendChild(

        bubble

    );





    chat.appendChild(

        message

    );





    scrollBottom();

/* =====================================================

   OPTION CLICK

===================================================== */



async function sendOption(text) {



    addUser(text);





    window.selectedIssue =

        text;





    /* =================================================

       ROLLOVER

    ================================================= */



    if (text === "rollover") {



        /*

         * IMPORTANT

         *

         * We DO NOT directly ask /search-user here.

         *

         * We first call /chat so Flask/LangGraph

         * identifies rollover and creates the

         * waiting_for_username session.

         */



        await normalChat(

            text

        );



        return;

    }





    /* =================================================

       MOTION ALERT

    ================================================= */



    if (

        text ===

        "motion detection false alert"

    ) {



        await normalChat(

            text

        );



        return;

    }





    /* =================================================

       APP CRASH

    ================================================= */



    if (

        text === "App crashing"

    ) {



        await normalChat(

            text

        );



        return;

    }





    /* =================================================

       LOGIN

    ================================================= */



    if (

        text === "Login issue"

    ) {



        await normalChat(

            text

        );



        return;

    }



}





/* =====================================================

   SEND MESSAGE

===================================================== */



async function sendMessage() {



    const input =

        document.getElementById("msg");





    const text =

        input.value.trim();





    if (!text) {



        return;



    }





    /* =================================================

       SHOW USER MESSAGE

    ================================================= */



    addUser(text);





    input.value = "";





    /* =================================================

       IMPORTANT

       EVERYTHING GOES THROUGH /chat

    ================================================= */



    await normalChat(

        text

    );



}





/* =====================================================
   NORMAL CHAT
   Sends a message through the existing WebSocket backend.
   Backend routing to support, RAG or general chat is unchanged.
   ===================================================== */
async function normalChat(message) {

    try {

        console.log("========== NORMAL CHAT ==========");
        console.log("Message:", message);
        console.log(
            "WebSocket state:",
            socket ? socket.readyState : "NO SOCKET"
        );

        // Do not send until the WebSocket connection is ready.
        if (!socket || socket.readyState !== WebSocket.OPEN) {

            console.error("WebSocket is not connected.");
            addBot("WebSocket is connecting. Please try again in a moment.");

            // Attempt to reconnect if the socket is closed.
            if (!socket || socket.readyState === WebSocket.CLOSED) {
                connectWebSocket();
            }

            return;
        }

        // Guard against duplicate requests while a response is streaming.
        if (responseInProgress) {
            console.log("A response is already in progress.");
            return;
        }

        // Reset the previous streaming response state.
        currentBubble = null;
        currentResponse = "";

        // Start the spinner and elapsed-time display before sending.
        startResponseUI();

        console.log("Sending through WebSocket:", message);

        // Send the user's message to ws_server.py.
        socket.send(message);

        console.log("Message sent!");

    } catch (error) {

        console.error("WebSocket chat error:", error);

        // Restore the UI if sending fails.
        finishResponseUI();
        addBot("Sorry, I couldn't process your message.");
    }
}


/* =====================================================

   STOP BUTTON

===================================================== */


function stopResponse() {

    // Do nothing when no response is currently being displayed.
    if (!responseInProgress) {
        return;
    }

    // This flag is local to the browser in the current implementation.
    // It does NOT cancel Ollama/LangGraph generation on the server.
    stopRequested = true;

    // Stop the timer and restore the Send button.
    finishResponseUI();

    // Inform the user that the browser stopped waiting for this response.
    addBot("Stopped waiting for the response.");

    console.log("Stop button clicked. Backend generation is not cancelled.");
}


/* =====================================================

   ENTER KEY

===================================================== */



document

    .getElementById("msg")

    .addEventListener(

        "keydown",

        function(event) {



            if (

                event.key === "Enter"

            ) {



                event.preventDefault();



                sendMessage();



            }



        }

    );





/* =====================================================

   AUTO SCROLL

===================================================== */



function scrollBottom() {



    chat.scrollTop =

        chat.scrollHeight;



}



</script>
